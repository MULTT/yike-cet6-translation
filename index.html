<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="译刻：每天两句，练习六级翻译并沉淀自己的表达。" />
    <meta name="theme-color" content="#f6f0e4" />
    <title>译刻｜六级翻译每日练习</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#practice" aria-label="译刻首页"><span class="brand-seal">译</span><span><b>译刻</b><small>YI·KE</small></span></a>
        <p class="brand-caption">把每一次翻译，<br />刻进自己的表达里。</p>
        <nav class="primary-nav" aria-label="学习导航">
          <button class="nav-item active" type="button" data-view="practice"><span>✦</span> 今日训练</button>
          <button class="nav-item" type="button" data-view="library"><span>▦</span> 真题题库</button>
          <button class="nav-item" type="button" data-view="reports"><span>◫</span> 我的报告</button>
          <button class="nav-item" type="button" data-view="mistakes"><span>⌁</span> 易错点 <i id="mistake-count">0</i></button>
          <button class="nav-item" type="button" data-view="review"><span>▱</span> 复习本 <i id="review-count">0</i></button>
        </nav>
        <div class="sidebar-foot">
          <div class="streak-card"><span>连续练习</span><strong id="streak">0 <em>天</em></strong><p>小小的坚持，正在累积。</p></div>
          <button class="text-button reset-button" type="button" id="reset-button">重置本地学习记录</button>
        </div>
      </aside>
      <section class="content" id="app-content"></section>
    </main>
    <nav class="mobile-nav" aria-label="学习导航">
      <button class="active" data-view="practice" type="button">✦<span>训练</span></button>
      <button data-view="library" type="button">▦<span>题库</span></button>
      <button data-view="reports" type="button">◫<span>报告</span></button>
      <button data-view="mistakes" type="button">⌁<span>易错</span></button>
      <button data-view="review" type="button">▱<span>复习</span></button>
    </nav>
    <template id="toast-template"><div class="toast" role="status"></div></template>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
